apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redayit-frontend-ingress
  namespace: redayit-frontend
  annotations:
    kubernetes.io/ingress.class: "nginx"
#     nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
#     nginx.ingress.kubernetes.io/ssl-passthrough: "true" 
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        frontend:
          service:
            name: redayit-frontend-service
            port:
              number: 3001
    host: redayfe.local


